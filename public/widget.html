<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YTB Auto Follow-up Test</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .wrap { padding: 14px; }
    .label { font-weight: 700; margin-bottom: 6px; }
    .field { border: 1px solid color-mix(in srgb, currentColor 20%, transparent); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; white-space: pre-wrap; }
    .status { opacity: .72; min-height: 1.45em; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="label">Trường test</div>
    <div class="field" id="testText">Metadata test stays visible here.</div>
    <div class="status" id="status">Đang tự động yêu cầu ChatGPT tạo thumbnail…</div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const status = $("status");

    const toolOutput = window.openai?.toolOutput;
    if (toolOutput?.testText) $("testText").textContent = toolOutput.testText;

    const saved = window.openai?.widgetState;
    if (saved?.testText) $("testText").textContent = saved.testText;

    const currentText = $("testText").textContent;
    const alreadySent = Boolean(saved?.autoSent);

    async function autoSend() {
      if (alreadySent) {
        status.textContent = "Yêu cầu tạo thumbnail đã được gửi.";
        return;
      }

      if (!window.openai?.sendFollowUpMessage) {
        status.textContent = "Host này không hỗ trợ auto follow-up.";
        return;
      }

      window.openai?.setWidgetState?.({
        testText: currentText,
        autoSent: true
      });

      const message = [
        "Generate exactly ONE standalone 16:9 YouTube thumbnail using ChatGPT's built-in Image Generation.",
        "This is only a capability test, so create a simple documentary-style thumbnail with the visible English text: YTB TEST.",
        "Do not restate metadata. Do not create a UI mockup, metadata panel, copy buttons, browser frame, or multiple alternatives.",
        "Return only the generated thumbnail image."
      ].join(" ");

      try {
        await window.openai.sendFollowUpMessage({
          prompt: message,
          scrollToBottom: true
        });
        status.textContent = "Đã tự động gửi yêu cầu tạo thumbnail.";
      } catch (error) {
        window.openai?.setWidgetState?.({
          testText: currentText,
          autoSent: false
        });
        status.textContent = `Không tự gửi được: ${error?.message || error}`;
      }
    }

    setTimeout(autoSend, 250);
  </script>
</body>
</html>
